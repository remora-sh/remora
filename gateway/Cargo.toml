[package]
name = "remora-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Optional WebSocket → SSH gateway for Remora web terminals"
license = "MIT OR Apache-2.0"
authors = ["Remora"]

[[bin]]
name = "remora-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
